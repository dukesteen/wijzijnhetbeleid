<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wij zijn het beleid | Afstudeerproject Job Koskamp</title>
    <meta
      name="description"
      content="Een redactionele website over wicked problems, sociale cooeperaties en het Markemodel, ontwikkeld als afstudeerproject van Job Koskamp."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                display: ["Oswald", "sans-serif"],
                serif: ["Source Serif 4", "serif"],
              },
              boxShadow: {
                editorial: "0 22px 55px rgba(17, 17, 17, 0.12)",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --paper: #f6efe4;
        --paper-strong: #efe3d2;
        --surface: rgba(255, 255, 255, 0.72);
        --ink: #111111;
        --muted: rgba(17, 17, 17, 0.68);
        --accent: #c92236;
        --accent-soft: rgba(201, 34, 54, 0.14);
        --accent-contrast: #ffffff;
        --line: rgba(17, 17, 17, 0.12);
        --display-shadow: rgba(17, 17, 17, 0.08);
      }

      html {
        scroll-behavior: smooth;
      }

      [id="achtergrond"],
      [id="de-praktijk"],
      [id="over-de-maker"],
      [id="optimist-special"] {
        scroll-margin-top: 11rem;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        overflow-wrap: break-word;
        word-break: break-word;
      }


      .paper-panel {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        box-shadow: 0 16px 40px rgba(17, 17, 17, 0.07);
      }

      .editorial-rule {
        background: linear-gradient(90deg, var(--accent), transparent);
        height: 2px;
      }

      .display-shadow {
        text-shadow: 0 8px 28px var(--display-shadow);
      }

      .vertical-label {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }

      .route-fade {
        animation: routeFade 420ms ease both;
      }

      .reveal-block {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 320ms ease, transform 320ms ease;
      }

      .reveal-block.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .accent-wash::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(135deg, var(--accent-soft), transparent 55%),
          radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.55), transparent 35%);
        pointer-events: none;
      }

      .story-copy p:first-letter {
        float: left;
        font-family: "Oswald", sans-serif;
        font-size: 4.75rem;
        line-height: 0.86;
        margin: 0.1rem 0.75rem 0 0;
        color: var(--accent);
      }

      .progress-rail {
        background: rgba(17, 17, 17, 0.08);
      }

      .progress-bar {
        background: var(--accent);
        transition: width 160ms linear;
      }

      .card-hover {
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }

      .card-hover:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 36px rgba(17, 17, 17, 0.11);
        border-color: rgba(17, 17, 17, 0.22);
      }

      @media (prefers-reduced-motion: reduce), (max-width: 767px) {
        html {
          scroll-behavior: auto;
        }

        .route-fade {
          animation: none;
        }

        .reveal-block {
          opacity: 1;
          transform: none;
          transition: none;
        }

        .progress-bar,
        .card-hover {
          transition: none;
        }
      }

      @keyframes routeFade {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 767px) {
        .story-copy p:first-letter {
          font-size: 3.25rem;
          margin-right: 0.5rem;
        }
      }
    </style>
  </head>
  <body class="font-serif antialiased selection:bg-black selection:text-white">
    <div id="app" class="min-h-screen"></div>
    <script defer src="./content.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
